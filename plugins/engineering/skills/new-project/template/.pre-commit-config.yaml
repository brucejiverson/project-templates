repos:
  # Ruff runs from the project's own .venv (uv.lock), so the hook, `make dev` and CI use one ruff version.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check --fix
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      # Full validation on push: the same command CI runs, so local and CI cannot drift.
      - id: make-dev
        name: make dev (lint, typecheck, tests)
        entry: make dev
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
