[project]
name = "__PROJECT__"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "pre-commit>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__PACKAGE__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs real hardware attached (deselect with -m 'not hardware')",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "C4",    # flake8-comprehensions
    "B",     # flake8-bugbear
    "N",     # pep8-naming
    "A",     # flake8-builtins
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "FURB",  # refurb
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["__PACKAGE__"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
# Strict is cheapest on a new project. If an untyped library makes it noisy, drop to "standard"
# for that file with a `# pyright: standard` comment rather than for the whole project.
typeCheckingMode = "strict"
reportMissingTypeStubs = false
